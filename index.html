<style>
*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:
 radial-gradient(circle at 15% 10%,rgba(0,234,255,.09),transparent 28%),
 radial-gradient(circle at 85% 20%,rgba(140,92,255,.10),transparent 28%),
 #040611;
 color:#fff;
 overflow-x:hidden;
}

a{
 text-decoration:none;
 color:inherit;
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

::selection{
 background:#00eaff;
 color:#000;
}

/* =========================
   HEADER
========================= */

header{
 position:sticky;
 top:0;
 z-index:1000;
 backdrop-filter:blur(18px);
 background:rgba(4,6,17,.78);
 border-bottom:1px solid rgba(0,234,255,.14);
}

.nav{
 max-width:1250px;
 margin:auto;
 min-height:70px;
 padding:10px 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:900;
 letter-spacing:1px;
}

.logoIcon{
 width:42px;
 height:42px;
 display:grid;
 place-items:center;
 border-radius:14px;
 background:linear-gradient(135deg,#00eaff,#8c5cff,#ff31d2);
 box-shadow:0 0 25px rgba(0,234,255,.3);
 color:#000;
}

.logoText span{
 display:block;
}

.logoMain{
 font-size:18px;
}

.logoSub{
 font-size:9px;
 color:#8da1bd;
 letter-spacing:2px;
}

.navlinks{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 justify-content:flex-end;
}

.navlinks a{
 padding:9px 11px;
 border-radius:12px;
 color:#b8c6dc;
 font-size:13px;
 transition:.25s;
}

.navlinks a:hover{
 color:#fff;
 background:rgba(0,234,255,.09);
 box-shadow:0 0 15px rgba(0,234,255,.08);
}

/* =========================
   GENERAL
========================= */

section{
 scroll-margin-top:90px;
}

.container{
 width:min(1180px,calc(100% - 28px));
 margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
 min-height:720px;
 display:grid;
 grid-template-columns:1.05fr .95fr;
 align-items:center;
 gap:35px;
 padding:65px 0 50px;
 position:relative;
}

.heroBadge{
 display:inline-flex;
 padding:8px 13px;
 border:1px solid rgba(0,234,255,.3);
 background:rgba(0,234,255,.06);
 border-radius:999px;
 color:#71f3ff;
 font-size:12px;
 letter-spacing:1px;
}

.hero h1{
 margin:18px 0 8px;
 font-size:clamp(52px,8vw,105px);
 line-height:.86;
 letter-spacing:-5px;
}

.hero h1 span{
 display:block;
 background:linear-gradient(90deg,#00eaff,#4d7cff,#8c5cff,#ff31d2);
 -webkit-background-clip:text;
 color:transparent;
}

.hero p{
 max-width:650px;
 color:#aebbd0;
 line-height:1.8;
 font-size:16px;
}

.heroButtons{
 display:flex;
 gap:12px;
 flex-wrap:wrap;
 margin-top:25px;
}

.btn{
 border:0;
 padding:13px 18px;
 border-radius:14px;
 color:#fff;
 background:#10172c;
 border:1px solid rgba(255,255,255,.12);
 transition:.25s;
}

.btn:hover{
 transform:translateY(-3px);
}

.btnPrimary{
 background:linear-gradient(135deg,#00eaff,#4d7cff);
 color:#001018;
 font-weight:900;
 box-shadow:0 10px 35px rgba(0,234,255,.18);
}

/* =========================
   HERO CORE
========================= */

.heroVisual{
 display:grid;
 place-items:center;
 min-height:450px;
 position:relative;
}

.core{
 width:min(430px,80vw);
 aspect-ratio:1;
 border-radius:50%;
 display:grid;
 place-items:center;
 position:relative;
 background:
 radial-gradient(circle at 35% 30%,#fff 0 2%,#00eaff 7%,transparent 25%),
 radial-gradient(circle,#071d34 0 30%,#050816 62%);
 box-shadow:
 0 0 40px rgba(0,234,255,.35),
 0 0 100px rgba(77,124,255,.18),
 inset 0 0 60px rgba(0,234,255,.15);
 animation:float 5s ease-in-out infinite;
}

.core:before,
.core:after{
 content:"";
 position:absolute;
 inset:-25px;
 border:1px solid rgba(0,234,255,.35);
 border-radius:50%;
 transform:rotate(35deg) scaleX(1.5);
 animation:spin 12s linear infinite;
}

.core:after{
 inset:-55px;
 transform:rotate(-45deg) scaleX(1.6);
 border-color:rgba(255,49,210,.2);
 animation-duration:18s;
}

.coreText{
 text-align:center;
 z-index:2;
}

.coreText strong{
 display:block;
 font-size:40px;
 letter-spacing:5px;
}

.coreText small{
 color:#66efff;
 letter-spacing:3px;
}

@keyframes float{
 50%{transform:translateY(-14px)}
}

@keyframes spin{
 to{transform:rotate(395deg) scaleX(1.5)}
}

/* =========================
   PROFILE
========================= */

.profile{
 display:grid;
 grid-template-columns:380px 1fr;
 gap:40px;
 align-items:center;
 padding:70px 0;
}

.profileCard{
 padding:18px;
 border-radius:30px;
 background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
 border:1px solid rgba(0,234,255,.2);
 box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.profileImageWrap{
 position:relative;
 overflow:hidden;
 border-radius:24px;
 cursor:pointer;
}

.profileImage{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 display:block;
 transition:.5s;
}

.profileImageWrap:hover .profileImage{
 transform:scale(1.05);
}

.profileGlow{
 position:absolute;
 inset:auto 10% -20px;
 height:70px;
 background:#00eaff;
 filter:blur(35px);
 opacity:.25;
}

.kicker{
 color:#00eaff;
 text-transform:uppercase;
 letter-spacing:3px;
 font-size:11px;
 font-weight:bold;
}

.sectionTitle{
 font-size:clamp(32px,5vw,58px);
 margin:8px 0 15px;
 letter-spacing:-2px;
}

.muted{
 color:#9eacc1;
 line-height:1.8;
}

/* =========================
   STATS
========================= */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-top:25px;
}

.stat{
 padding:20px 12px;
 text-align:center;
 border-radius:18px;
 background:rgba(255,255,255,.035);
 border:1px solid rgba(255,255,255,.08);
}

.stat b{
 display:block;
 font-size:25px;
 color:#00eaff;
}

.stat span{
 font-size:11px;
 color:#8492a9;
}

/* =========================
   PANELS
========================= */

.panel{
 padding:28px;
 border-radius:28px;
 background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
 border:1px solid rgba(255,255,255,.09);
 box-shadow:0 25px 70px rgba(0,0,0,.2);
 margin:35px 0;
}

.sectionHead{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:15px;
 margin-bottom:20px;
}

.search{
 width:100%;
 padding:14px 16px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,.12);
 background:#070b19;
 color:#fff;
 outline:none;
}

.search:focus{
 border-color:#00eaff;
 box-shadow:0 0 20px rgba(0,234,255,.08);
}

/* =========================
   GALLERY
========================= */

.galleryGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px;
}

.galleryCard{
 overflow:hidden;
 border-radius:22px;
 background:#080c1a;
 border:1px solid rgba(255,255,255,.08);
 transition:.3s;
}

.galleryCard:hover{
 transform:translateY(-5px);
 border-color:rgba(0,234,255,.35);
 box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.galleryImgWrap{
 position:relative;
 cursor:pointer;
 overflow:hidden;
 background:#050816;
}

.galleryImg{
 width:100%;
 aspect-ratio:4/5;
 object-fit:cover;
 display:block;
 transition:.4s;
}

.galleryImgWrap:hover .galleryImg{
 transform:scale(1.04);
}

.imageZoom{
 position:absolute;
 right:10px;
 top:10px;
 padding:8px 10px;
 border-radius:10px;
 background:rgba(0,0,0,.65);
 backdrop-filter:blur(8px);
}

.cardBody{
 padding:15px;
}

.cardTitle{
 font-weight:bold;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.cardDescription{
 margin-top:8px;
 color:#a8b5c8;
 font-size:12px;
 line-height:1.6;
}

.cardPrompt{
 margin-top:9px;
 color:#7f8ca2;
 font-size:12px;
 line-height:1.5;
 max-height:38px;
 overflow:hidden;
}

.cardActions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:13px;
}

.cardActionsBottom{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
 margin-top:7px;
}

.smallBtn{
 border:1px solid rgba(255,255,255,.09);
 background:#0d1324;
 color:#dce7f6;
 padding:9px 7px;
 border-radius:11px;
 font-size:12px;
 transition:.2s;
}

.smallBtn:hover{
 border-color:#00eaff;
 color:#fff;
 transform:translateY(-1px);
}

.downloadBtn{
 background:linear-gradient(135deg,rgba(0,234,255,.15),rgba(77,124,255,.12));
}

.shareBtn{
 background:linear-gradient(135deg,rgba(140,92,255,.15),rgba(255,49,210,.10));
}

.empty{
 text-align:center;
 padding:50px 20px;
 color:#74839a;
}

/* =========================
   GALLERY INFO BADGE
========================= */

.galleryBadge{
 position:absolute;
 left:10px;
 top:10px;
 padding:7px 9px;
 border-radius:10px;
 background:rgba(0,0,0,.62);
 backdrop-filter:blur(8px);
 color:#bffaff;
 font-size:10px;
 border:1px solid rgba(0,234,255,.2);
}

/* =========================
   WHATSAPP SECTION
========================= */

.whatsappSection{
 margin-top:25px;
 padding:20px;
 border-radius:22px;
 border:1px solid rgba(37,211,102,.22);
 background:
 linear-gradient(135deg,rgba(37,211,102,.09),rgba(0,234,255,.04)),
 rgba(255,255,255,.02);
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:18px;
}

.whatsappInfo{
 display:flex;
 align-items:center;
 gap:14px;
}

.whatsappIcon{
 width:50px;
 height:50px;
 flex:0 0 50px;
 display:grid;
 place-items:center;
 border-radius:16px;
 background:rgba(37,211,102,.14);
 border:1px solid rgba(37,211,102,.3);
 font-size:26px;
 box-shadow:0 0 25px rgba(37,211,102,.08);
}

.whatsappTitle{
 font-weight:900;
 font-size:17px;
}

.whatsappText{
 color:#8f9eb3;
 font-size:12px;
 margin-top:4px;
 line-height:1.5;
}

.whatsappBtn{
 background:linear-gradient(135deg,#25d366,#128c7e);
 color:#fff;
 font-weight:900;
 border:0;
}

/* =========================
   COMMANDS
========================= */

.commandTools{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:20px;
}

.categories{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:8px;
}

.catBtn{
 white-space:nowrap;
 padding:9px 13px;
 border:1px solid rgba(255,255,255,.09);
 background:#080d1c;
 color:#9cabc0;
 border-radius:999px;
}

.catBtn.active,
.catBtn:hover{
 background:linear-gradient(135deg,#00eaff,#8c5cff);
 color:#02040a;
 font-weight:bold;
}

.commandGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:13px;
}

.commandCard{
 min-height:145px;
 padding:16px;
 border-radius:19px;
 position:relative;
 overflow:hidden;
 background:
 linear-gradient(145deg,rgba(0,234,255,.08),rgba(140,92,255,.05)),
 #080c1a;
 border:1px solid rgba(0,234,255,.12);
 box-shadow:
 inset 0 1px rgba(255,255,255,.06),
 0 12px 30px rgba(0,0,0,.18);
 transition:.25s;
}

.commandCard:before{
 content:"";
 position:absolute;
 width:100px;
 height:100px;
 right:-45px;
 top:-45px;
 background:#ff31d2;
 filter:blur(45px);
 opacity:.15;
}

.commandCard:hover{
 transform:translateY(-5px) rotateX(2deg);
 border-color:#00eaff;
 box-shadow:0 15px 40px rgba(0,234,255,.12);
}

.commandName{
 font-weight:900;
 color:#fff;
 font-size:16px;
}

.commandDesc{
 color:#8593a9;
 font-size:12px;
 line-height:1.5;
 margin:10px 0;
}

.copyCommand{
 width:100%;
 padding:9px;
 border:0;
 border-radius:10px;
 background:linear-gradient(135deg,#00eaff,#4d7cff);
 color:#001018;
 font-weight:900;
}

.commandCount{
 color:#00eaff;
 font-size:12px;
 margin-top:10px;
}

/* =========================
   PROMPT LAB
========================= */

.lab{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}

textarea{
 width:100%;
 min-height:230px;
 resize:vertical;
 padding:15px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,.1);
 background:#050816;
 color:#fff;
 outline:none;
}

.output{
 min-height:230px;
 padding:18px;
 border-radius:16px;
 background:#050816;
 border:1px solid rgba(0,234,255,.12);
 color:#dce8f8;
 white-space:pre-wrap;
 line-height:1.7;
}

/* =========================
   ABOUT
========================= */

.aboutGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}

.feature{
 padding:22px;
 border-radius:20px;
 background:rgba(255,255,255,.035);
 border:1px solid rgba(255,255,255,.08);
}

.featureIcon{
 font-size:28px;
}

.feature h3{
 margin:12px 0 7px;
}

.feature p{
 font-size:13px;
 color:#8492a7;
 line-height:1.6;
}

/* =========================
   KEYWORDS
========================= */

.keywords{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.keyword{
 padding:7px 10px;
 border-radius:999px;
 font-size:11px;
 color:#a9b7cb;
 background:#090f20;
 border:1px solid rgba(255,255,255,.08);
}

/* =========================
   ADMIN
========================= */

.adminGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:7px;
 margin-bottom:13px;
}

.field label{
 font-size:12px;
 color:#8e9cb0;
}

.field input,
.field textarea{
 min-height:auto;
 padding:13px;
}

.field textarea{
 min-height:130px;
}

.fieldHint{
 color:#64738b;
 font-size:10px;
 line-height:1.5;
}

#adminPanel{
 display:none;
}

/* =========================
   FOOTER
========================= */

footer{
 margin-top:60px;
 padding:35px 15px;
 text-align:center;
 color:#718097;
 border-top:1px solid rgba(255,255,255,.07);
}

.footerLogo{
 font-size:25px;
 font-weight:900;
 color:#fff;
}

/* =========================
   MODAL
========================= */

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:5000;
 background:rgba(0,0,0,.92);
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal.show{
 display:flex;
}

.modalContent{
 max-width:1100px;
 max-height:95vh;
 position:relative;
 display:flex;
 flex-direction:column;
 align-items:center;
}

.modalImage{
 max-width:95vw;
 max-height:75vh;
 object-fit:contain;
 border-radius:15px;
 box-shadow:0 0 60px rgba(0,234,255,.12);
}

.modalInfo{
 width:min(800px,95vw);
 margin-top:12px;
 padding:13px;
 border-radius:14px;
 background:rgba(10,16,31,.9);
 border:1px solid rgba(0,234,255,.12);
}

.modalTitle{
 font-weight:900;
}

.modalDescription{
 color:#9baac0;
 font-size:12px;
 line-height:1.6;
 margin-top:5px;
}

.modalBar{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap;
 justify-content:center;
}

.closeModal{
 position:fixed;
 right:20px;
 top:20px;
 z-index:3;
 width:44px;
 height:44px;
 border-radius:50%;
 border:1px solid rgba(255,255,255,.15);
 background:#101522;
 color:#fff;
 font-size:24px;
}

/* =========================
   TOAST
========================= */

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 z-index:9000;
 transform:translateY(120px);
 opacity:0;
 padding:13px 17px;
 border-radius:13px;
 background:#0d1527;
 border:1px solid rgba(0,234,255,.25);
 box-shadow:0 15px 40px rgba(0,0,0,.4);
 transition:.3s;
}

.toast.show{
 transform:translateY(0);
 opacity:1;
}

/* =========================
   LOADER
========================= */

.loader{
 position:fixed;
 inset:0;
 z-index:10000;
 display:grid;
 place-items:center;
 background:#040611;
 transition:.5s;
}

.loader.hide{
 opacity:0;
 pointer-events:none;
}

.loaderCore{
 text-align:center;
}

.loaderRing{
 width:70px;
 height:70px;
 margin:auto auto 15px;
 border:3px solid rgba(0,234,255,.15);
 border-top-color:#00eaff;
 border-radius:50%;
 animation:spinLoader .8s linear infinite;
}

.loaderBrand{
 font-size:22px;
 font-weight:900;
 letter-spacing:2px;
}

.loaderSub{
 font-size:11px;
 color:#00eaff;
 margin-top:7px;
 letter-spacing:2px;
}

@keyframes spinLoader{
 to{transform:rotate(360deg)}
}

/* =========================
   PARTICLES
========================= */

#particles{
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:-1;
 opacity:.35;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

 .hero{
  grid-template-columns:1fr;
  padding-top:45px;
 }

 .heroVisual{
  min-height:380px;
 }

 .profile{
  grid-template-columns:1fr;
 }

 .galleryGrid{
  grid-template-columns:repeat(2,1fr);
 }

 .commandGrid{
  grid-template-columns:repeat(3,1fr);
 }

 .aboutGrid{
  grid-template-columns:repeat(2,1fr);
 }

 .adminGrid,
 .lab{
  grid-template-columns:1fr;
 }

 .navlinks{
  display:none;
 }

}

@media(max-width:600px){

 .container{
  width:min(100% - 20px,1180px);
 }

 .hero h1{
  font-size:55px;
  letter-spacing:-3px;
 }

 .hero{
  min-height:auto;
  padding:45px 0;
 }

 .heroVisual{
  min-height:300px;
 }

 .core{
  width:290px;
 }

 .coreText strong{
  font-size:28px;
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .panel{
  padding:17px;
  border-radius:20px;
 }

 .galleryGrid{
  grid-template-columns:repeat(2,1fr);
  gap:10px;
 }

 .commandGrid{
  grid-template-columns:repeat(2,1fr);
  gap:9px;
 }

 .commandCard{
  min-height:155px;
  padding:12px;
 }

 .commandName{
  font-size:14px;
 }

 .aboutGrid{
  grid-template-columns:1fr 1fr;
  gap:9px;
 }

 .feature{
  padding:15px;
 }

 .sectionHead{
  display:block;
 }

 .logoMain{
  font-size:15px;
 }

 .logoIcon{
  width:36px;
  height:36px;
 }

 .cardActions{
  grid-template-columns:repeat(3,1fr);
  gap:5px;
