<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
    radial-gradient(circle at top,#181818 0%,#070707 45%,#000 100%);
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#888;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.telegram,
.contact{
    color:#fff;
    text-decoration:none;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.13);
    transition:.25s;
    font-size:13px;
}

.telegram:hover,
.contact:hover{
    background:#fff;
    color:#000;
}

/* HERO */

.hero{
    text-align:center;
    padding:90px 0 65px;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    color:#aaa;
    font-size:12px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(48px,9vw,90px);
    line-height:.95;
    letter-spacing:-5px;
    margin-bottom:22px;
}

.hero h1 span{
    color:#777;
}

.hero p{
    max-width:680px;
    margin:auto;
    color:#999;
    line-height:1.7;
    font-size:16px;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:30px;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    outline:none;
    border:1px solid rgba(255,255,255,.12);
    background:#0d0d0d;
    color:#fff;
}

.search input::placeholder{
    color:#666;
}

.btn{
    border:0;
    border-radius:14px;
    padding:14px 20px;
    background:#fff;
    color:#000;
    font-weight:800;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.btn.dark{
    background:#111;
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
}

/* GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding-bottom:80px;
}

.card{
    overflow:hidden;
    border-radius:22px;
    background:linear-gradient(145deg,#121212,#080808);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(255,255,255,.18);
}

.card-image{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#111;
    cursor:pointer;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.4s;
}

.card:hover .card-image img{
    transform:scale(1.04);
}

.view-label{
    position:absolute;
    right:12px;
    bottom:12px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    font-size:11px;
}

.card-body{
    padding:17px;
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:8px;
}

.card-caption{
    color:#999;
    font-size:14px;
    line-height:1.5;
    margin-bottom:12px;
}

.prompt-box{
    padding:11px;
    border-radius:12px;
    background:#070707;
    border:1px solid rgba(255,255,255,.07);
    color:#aaa;
    font-size:12px;
    line-height:1.5;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:13px;
}

.action{
    flex:1;
    min-width:70px;
    padding:9px 8px;
    border-radius:10px;
    background:#111;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
    font-size:12px;
}

.action:hover{
    background:#222;
}

.action.delete{
    color:#ff7777;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    border:1px dashed rgba(255,255,255,.12);
    border-radius:20px;
    color:#777;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#777;
}

/* STATUS */

.status{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:20px;
}

/* IMAGE MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(12px);
}

.modal.active{
    display:flex;
}

.modal-content{
    position:relative;
    width:min(1100px,96vw);
    max-height:94vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-content img{
    max-width:100%;
    max-height:90vh;
    object-fit:contain;
    border-radius:16px;
}

.close{
    position:absolute;
    top:-10px;
    right:-10px;
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:#111;
    color:#fff;
    font-size:23px;
    z-index:5;
}

/* UPLOAD MODAL */

.upload-modal{
    position:fixed;
    inset:0;
    z-index:1100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.84);
    backdrop-filter:blur(15px);
}

.upload-modal.active{
    display:flex;
}

.upload-box{
    width:min(520px,95vw);
    max-height:92vh;
    overflow:auto;
    background:#0d0d0d;
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:25px;
}

.upload-box h2{
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

.field input,
.field textarea{
    width:100%;
    padding:13px;
    border-radius:12px;
    outline:none;
    border:1px solid rgba(255,255,255,.12);
    background:#050505;
    color:#fff;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.upload-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.upload-actions button{
    flex:1;
}

/* FOOTER */

footer{
    border-top:1px solid rgba(255,255,255,.08);
    padding:30px 0;
    text-align:center;
    color:#666;
    font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .nav{
        min-height:62px;
    }

    .logo{
        font-size:20px;
    }

    .nav-right{
        gap:5px;
    }

    .telegram,
    .contact{
        padding:8px 9px;
        font-size:11px;
    }

    .hero{
        padding:65px 0 45px;
    }

    .hero h1{
        font-size:50px;
        letter-spacing:-3px;
    }

    .controls{
        flex-direction:column;
        align-items:stretch;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .controls .btn{
        width:100%;
    }

}

</style>
</head>

<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    increment,
    orderBy,
    query
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDE3twTS8yuRDzpHvjCfZFzDnAK0pi-6Ho",

    authDomain:
    "broken-boy-f5087.firebaseapp.com",

    projectId:
    "broken-boy-f5087",

    storageBucket:
    "broken-boy-f5087.firebasestorage.app",

    messagingSenderId:
    "1086620986469",

    appId:
    "1:1086620986469:web:0c08c7c876e5389ae8aa8c",

    measurementId:
    "G-F2E1B5LWEN"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"g33rvuls";

const CLOUDINARY_UPLOAD_PRESET =
"brokenai";

const CLOUDINARY_URL =
`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


/* =========================
   VARIABLES
========================= */

let images = [];

const gallery =
document.getElementById("gallery");

const searchInput =
document.getElementById("searchInput");

const status =
document.getElementById("status");

const uploadModal =
document.getElementById("uploadModal");

const imageModal =
document.getElementById("imageModal");

const modalImage =
document.getElementById("modalImage");


/* =========================
   LOAD IMAGES
========================= */

async function loadImages(){

    try{

        status.textContent =
        "Loading gallery...";


        const q =
        query(
            collection(db,"images"),
            orderBy("createdAt","desc")
        );


        const snapshot =
        await getDocs(q);


        images =
        snapshot.docs.map(item => ({

            id:item.id,

            ...item.data()

        }));


        renderImages();


        status.textContent =
        `${images.length} image${images.length === 1 ? "" : "s"} in gallery`;


    }catch(error){

        console.error(error);


        status.textContent =
        "Gallery loading error";


        gallery.innerHTML = `

            <div class="empty">

                <h3>
                    Gallery Error
                </h3>

                <p style="margin-top:8px;">
                    Please check Firebase Firestore.
                </p>

            </div>

        `;

    }

}


/* =========================
   UPLOAD MODAL
========================= */

window.openUpload = function(){

    uploadModal.classList.add(
        "active"
    );

};


window.closeUpload = function(){

    uploadModal.classList.remove(
        "active"
    );

};


/* =========================
   UPLOAD IMAGE
========================= */

window.uploadImage = async function(){

    const file =
    document.getElementById("imageFile").files[0];


    const title =
    document.getElementById("imageTitle").value.trim();


    const caption =
    document.getElementById("imageCaption").value.trim();


    const prompt =
    document.getElementById("imagePrompt").value.trim();


    const button =
    document.getElementById("uploadButton");


    if(!file){

        alert(
            "Please select an image."
        );

        return;

    }


    if(!title){

        alert(
            "Please enter image title."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
    "Uploading...";


    try{

        /* CLOUDINARY */

        const formData =
        new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        const cloudinaryResponse =
        await fetch(
            CLOUDINARY_URL,
            {
                method:"POST",
                body:formData
            }
        );


        const cloudinaryData =
        await cloudinaryResponse.json();


        if(!cloudinaryResponse.ok){

            throw new Error(
                cloudinaryData.error?.message ||
                "Cloudinary upload failed"
            );

        }


        const imageURL =
        cloudinaryData.secure_url;


        /* FIRESTORE */

        await addDoc(
            collection(db,"images"),
            {

                url:imageURL,

                title:title,

                caption:caption,

                prompt:prompt,

                likes:0,

                createdAt:Date.now()

            }
        );


        /* RESET */

        document.getElementById(
            "imageFile"
        ).value = "";


        document.getElementById(
            "imageTitle"
        ).value = "";


        document.getElementById(
            "imageCaption"
        ).value = "";


        document.getElementById(
            "imagePrompt"
        ).value = "";


        closeUpload();


        await loadImages();


        alert(
            "Image uploaded successfully! 🎉"
        );


    }catch(error){

        console.error(error);


        alert(
            "Upload failed:\n" +
            error.message
        );


    }finally{

        button.disabled = false;

        button.textContent =
        "Upload";

    }

};


/* =========================
   RENDER
========================= */

function renderImages(){

    const search =
    searchInput.value
    .toLowerCase()
    .trim();


    const filtered =
    images.filter(item => {

        const text = `

            ${item.title || ""}

            ${item.caption || ""}

            ${item.prompt || ""}

        `.toLowerCase();


        return text.includes(
            search
        );

    });


    if(filtered.length === 0){

        gallery.innerHTML = `

            <div class="empty">

                <h3>
                    No images found
                </h3>

                <p style="margin-top:8px;">
                    Upload your first AI image.
                </p>

            </div>

        `;

        return;

    }


    gallery.innerHTML =
    filtered.map(item => {

        return `

        <article class="card">

            <div
                class="card-image"
                onclick="openImage('${escapeAttr(item.url)}')">

                <img
                    src="${escapeAttr(item.url)}"
                    alt="${escapeAttr(item.title || "AI Image")}"
                    loading="lazy">

                <div class="view-label">
                    Tap to view
                </div>

            </div>


            <div class="card-body">

                <div class="card-title">

                    ${escapeHTML(
                        item.title ||
                        "Untitled"
                    )}

                </div>


                <div class="card-caption">

                    ${escapeHTML(
                        item.caption ||
                        "No caption"
                    )}

                </div>


                ${
                    item.prompt
                    ?
                    `

                    <div class="prompt-box">

                        <strong>
                            Prompt:
                        </strong>

                        <br>

                        ${escapeHTML(
                            item.prompt
                        )}

                    </div>

                    `
                    :
                    ""
                }


                <div class="actions">

                    <button
                        class="action"
                        onclick="copyPrompt('${item.id}')">

                        📋 Copy

                    </button>


                    <button
                        class="action"
                        onclick="likeImage('${item.id}')">

                        ❤️ ${item.likes || 0}

                    </button>


                    <button
                        class="action"
                        onclick="downloadImage('${escapeAttr(item.url)}','${escapeAttr(item.title || "broken-ai-image")}')">

                        ⬇️ Download

                    </button>


                    <button
                        class="action delete"
                        onclick="deleteImage('${item.id}')">

                        🗑️ Delete

                    </button>

                </div>

            </div>

        </article>

        `;

    }).join("");

}


/* =========================
   FULLSCREEN IMAGE
========================= */

window.openImage = function(url){

    modalImage.src =
    url;


    imageModal.classList.add(
        "active"
    );


    document.body.style.overflow =
    "hidden";

};


window.closeImage = function(event){

    if(
        event &&
        event.target !== imageModal
    ){

        return;

    }


    imageModal.classList.remove(
        "active"
    );


    modalImage.src =
    "";


    document.body.style.overflow =
    "";

};


/* =========================
   COPY PROMPT
========================= */

window.copyPrompt = async function(id){

    const item =
    images.find(
        x => x.id === id
    );


    if(!item){

        return;

    }


    if(!item.prompt){

        alert(
            "No prompt available."
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            item.prompt
        );


        alert(
            "Prompt copied! 📋"
        );


    }catch(error){

        alert(
            "Copy failed."
        );

    }

};


/* =========================
   LIKE
========================= */

window.likeImage = async function(id){

    try{

        const imageRef =
        doc(
            db,
            "images",
            id
        );


        await updateDoc(
            imageRef,
            {
                likes:
                increment(1)
            }
        );


        await loadImages();


    }catch(error){

        console.error(error);


        alert(
            "Like failed."
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteImage = async function(id){

    const yes =
    confirm(
        "Are you sure you want to delete this image?"
    );


    if(!yes){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "images",
                id
            )
        );


        await loadImages();


    }catch(error){

        console.error(error);


        alert(
            "Delete failed."
        );

    }

};


/* =========================
   DOWNLOAD
========================= */

window.downloadImage = async function(
    url,
    title
){

    try{

        const response =
        await fetch(url);


        const blob =
        await response.blob();


        const blobURL =
        URL.createObjectURL(
            blob
        );


        const link =
        document.createElement(
            "a"
        );


        link.href =
        blobURL;


        link.download =
        `${title || "broken-ai-image"}.jpg`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            blobURL
        );


    }catch(error){

        window.open(
            url,
            "_blank"
        );

    }

};


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    renderImages
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            imageModal.classList.remove(
                "active"
            );


            uploadModal.classList.remove(
                "active"
            );


            document.body.style.overflow =
            "";

        }

    }
);


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value){

    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(value){

    return String(value)

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /\n/g,
        " "
    );

}
