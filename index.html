
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broken Boy | Official Website</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#08090d;
  color:white;
}

header{
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#11131a;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #252832;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

nav a{
  color:#ddd;
  text-decoration:none;
  margin-left:18px;
}

.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(180deg,#151722,#08090d);
}

.profile{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #fff;
  margin-bottom:20px;
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.buttons{
  margin-top:25px;
}

.btn{
  display:inline-block;
  padding:13px 22px;
  margin:6px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  background:#222631;
  border:1px solid #383d49;
}

.telegram{
  background:#168bd0;
  border:none;
}

section{
  max-width:1000px;
  margin:auto;
  padding:50px 20px;
}

.title{
  text-align:center;
  margin-bottom:30px;
  font-size:28px;
}

.about{
  text-align:center;
  color:#bbb;
  line-height:1.8;
  font-size:17px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:15px;
  background:#15171e;
}

.edit-box{
  background:#11131a;
  padding:25px;
  border-radius:18px;
  border:1px solid #292d37;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #343946;
  background:#08090d;
  color:white;
}

button{
  padding:13px 20px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  cursor:pointer;
  margin-top:8px;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
  border-top:1px solid #22252d;
}

@media(max-width:600px){
  header{
    padding:15px;
  }

  nav a{
    margin-left:8px;
    font-size:13px;
  }

  .hero h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">💔 Broken Boy</div>

  <nav>
    <a href="#home">होम</a>
    <a href="#gallery">फोटो</a>
    <a href="#about">मेरे बारे में</a>
  </nav>
</header>

<div class="hero" id="home">

  <img
    id="profileImage"
    class="profile"
    src="https://via.placeholder.com/300"
    alt="Profile">

  <h1 id="profileName">Broken Boy</h1>

  <p id="profileBio">
    मेरी दुनिया, मेरी कहानी 💔
  </p>

  <div class="buttons">

    <a
      class="btn telegram"
      href="https://t.me/"
      target="_blank">
      ✈️ Telegram
    </a>

    <a
      class="btn"
      href="#gallery">
      🖼️ मेरी फोटो
    </a>

  </div>
</div>


<section id="about">

  <h2 class="title">मेरे बारे में</h2>

  <div class="about">

    <p id="aboutText">
      स्वागत है मेरी आधिकारिक वेबसाइट पर।
      यहाँ मेरी तस्वीरें, सोशल लिंक और मेरी पसंद की चीजें मिलेंगी।
    </p>

  </div>

</section>


<section id="gallery">

  <h2 class="title">🖼️ फोटो गैलरी</h2>

  <div class="gallery" id="galleryBox">

    <img src="https://via.placeholder.com/500x600" alt="Photo">

    <img src="https://via.placeholder.com/500x600" alt="Photo">

    <img src="https://via.placeholder.com/500x600" alt="Photo">

  </div>

  <br>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    multiple>

</section>


<section>

  <h2 class="title">✏️ प्रोफाइल एडिट</h2>

  <div class="edit-box">

    <input
      id="nameInput"
      type="text"
      placeholder="अपना नाम">

    <input
      id="bioInput"
      type="text"
      placeholder="अपना Bio">

    <input
      id="telegramInput"
      type="text"
      placeholder="Telegram Username">

    <button onclick="saveProfile()">
      प्रोफाइल सेव करें
    </button>

  </div>

</section>


<footer>
  © 2026 Broken Boy — All Rights Reserved
</footer>


<script>

function saveProfile(){

  let name =
    document.getElementById("nameInput").value;

  let bio =
    document.getElementById("bioInput").value;

  let telegram =
    document.getElementById("telegramInput").value;

  if(name){
    document.getElementById("profileName").innerText = name;
  }

  if(bio){
    document.getElementById("profileBio").innerText = bio;
  }

  if(telegram){
    document.querySelector(".telegram").href =
      "https://t.me/" + telegram.replace("@","");
  }

  alert("प्रोफाइल अपडेट हो गई ✅");
}


document
.getElementById("photoInput")
.addEventListener("change",function(event){

  let files = event.target.files;

  for(let file of files){

    let reader = new FileReader();

    reader.onload = function(e){

      let img = document.createElement("img");

      img.src = e.target.result;

      document
      .getElementById("galleryBox")
      .appendChild(img);

    };

    reader.readAsDataURL(file);
  }

});

</script>

</body>
</html>
