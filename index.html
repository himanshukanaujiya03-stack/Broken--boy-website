<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broken AI | AI Images</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07070b;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0d0d13;
  border-bottom:1px solid #222;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:18px;
  align-items:center;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

button{
  border:0;
  cursor:pointer;
  border-radius:10px;
}

.admin-btn{
  background:#fff;
  color:#000;
  padding:9px 14px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:70px 20px 45px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border:1px solid #333;
  border-radius:30px;
  color:#aaa;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,8vw,75px);
  margin-bottom:15px;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:#aaa;
  line-height:1.7;
}

.hero-buttons{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.primary{
  background:white;
  color:black;
  padding:13px 20px;
  font-weight:bold;
}

.secondary{
  background:#17171e;
  color:white;
  border:1px solid #333;
  padding:13px 20px;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

.search-box{
  margin:20px 0 30px;
}

.search-box input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  background:#111118;
  color:white;
  outline:none;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
  padding-bottom:60px;
}

.card{
  background:#101017;
  border:1px solid #222;
  border-radius:16px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
  cursor:pointer;
  transition:.25s;
}

.card img:hover{
  transform:scale(1.02);
}

.card-content{
  padding:14px;
}

.card h3{
  margin-bottom:7px;
}

.card p{
  color:#999;
  font-size:13px;
  line-height:1.5;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.small-btn{
  padding:8px 10px;
  background:#191922;
  color:white;
  border:1px solid #30303a;
}

.delete-btn{
  background:#35151a;
  color:#ff7b86;
  border:1px solid #63242c;
}

.upload-section{
  display:none;
  background:#101017;
  border:1px solid #292933;
  border-radius:16px;
  padding:20px;
  margin-bottom:50px;
}

.upload-section h2{
  margin-bottom:18px;
}

.upload-section input,
.upload-section textarea{
  width:100%;
  margin-bottom:12px;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#08080d;
  color:white;
  outline:none;
}

.upload-section textarea{
  min-height:100px;
  resize:vertical;
}

.upload-btn{
  padding:12px 18px;
  background:white;
  color:black;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#777;
  border-top:1px solid #222;
}

/* IMAGE VIEW */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:1000px;
  max-height:95vh;
  overflow:auto;
  text-align:center;
  position:relative;
}

.modal-img{
  max-width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:12px;
}

.close-btn{
  position:fixed;
  top:18px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  color:black;
  font-size:25px;
  font-weight:bold;
  z-index:1100;
}

.modal-title{
  margin-top:15px;
  font-size:22px;
}

.modal-caption{
  color:#aaa;
  margin-top:7px;
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* LOGIN */
.login-modal{
  display:none;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#111118;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

.login-box h2{
  margin-bottom:18px;
}

.login-box input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#08080d;
  color:white;
}

.login-submit{
  width:100%;
  padding:13px;
  background:white;
  color:black;
  font-weight:bold;
}

.close-login{
  float:right;
  background:none;
  color:white;
  font-size:25px;
}

@media(max-width:650px){
  nav a{
    display:none;
  }

  header{
    padding:12px 4%;
  }

  .card img{
    height:230px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Broken AI</div>

  <nav>
    <a href="#gallery">Gallery</a>
    <a href="#upload" id="uploadNav" style="display:none;">Upload</a>
    <a href="https://t.me/Brokenboy221716" target="_blank">Telegram</a>
    <a href="https://wa.me/917318399281" target="_blank">Contact</a>
    <button class="admin-btn" id="adminBtn">Admin Login</button>
  </nav>
</header>

<section class="hero">
  <div class="badge">AI IMAGE GALLERY</div>

  <h1>Broken AI</h1>

  <p>
    Explore beautiful AI generated images, creative prompts
    and premium visual creations.
  </p>

  <div class="hero-buttons">
    <button class="primary" id="heroUpload" style="display:none;">
      Upload Image
    </button>

    <a
      href="https://t.me/Brokenboy221716"
      target="_blank"
      class="secondary"
      style="text-decoration:none;"
    >
      Join Telegram
    </a>
  </div>
</section>

<main class="container">

  <div class="search-box" id="gallery">
    <input
      type="text"
      id="searchInput"
      placeholder="Image search करें..."
    >
  </div>

  <!-- ADMIN UPLOAD -->
  <section class="upload-section" id="upload">

    <h2>Upload New Image</h2>

    <input type="file" id="imageFile" accept="image/*">

    <input
      type="text"
      id="imageTitle"
      placeholder="Image title"
    >

    <textarea
      id="imageCaption"
      placeholder="Caption"
    ></textarea>

    <textarea
      id="imagePrompt"
      placeholder="AI Prompt"
    ></textarea>

    <button class="upload-btn" id="uploadBtn">
      Upload Image
    </button>

  </section>

  <div class="gallery" id="galleryBox"></div>

</main>

<footer>
  © 2026 Broken AI — AI Images
</footer>


<!-- IMAGE MODAL -->
<div class="modal" id="imageModal">

  <button class="close-btn" id="closeImage">
    ×
  </button>

  <div class="modal-box">

    <img
      id="modalImage"
      class="modal-img"
      src=""
      alt="AI Image"
    >

    <h2 id="modalTitle" class="modal-title"></h2>

    <p id="modalCaption" class="modal-caption"></p>

    <div class="modal-actions">

      <button class="small-btn" id="copyPrompt">
        Copy Prompt
      </button>

      <button class="small-btn" id="likeBtn">
        ❤️ Like <span id="likeCount">0</span>
      </button>

      <button class="small-btn" id="downloadBtn">
        Download
      </button>

      <button class="small-btn delete-btn" id="modalDelete">
        Delete
      </button>

    </div>

  </div>
</div>


<!-- LOGIN MODAL -->
<div class="modal login-modal" id="loginModal">

  <div class="login-box">

    <button class="close-login" id="closeLogin">
      ×
    </button>

    <h2>Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button class="login-submit" id="loginSubmit">
      Login
    </button>

  </div>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  increment,
  orderBy,
  query,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDE3twTS8yuRDzpHvjCfZFzDnAK0pi-6Ho",
  authDomain: "broken-boy-f5087.firebaseapp.com",
  projectId: "broken-boy-f5087",
  storageBucket: "broken-boy-f5087.firebasestorage.app",
  messagingSenderId: "1086620986469",
  appId: "1:1086620986469:web:0c08c7c876e5389ae8aa8c",
  measurementId: "G-F2E1B5LWEN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


/* CLOUDINARY */

const CLOUDINARY_CLOUD_NAME = "g33rvuls";
const CLOUDINARY_UPLOAD_PRESET = "brokenai";


/* ADMIN */

const ADMIN_EMAIL = "himanshukanaujiya03@gmail.com";

let isAdmin = false;
let images = [];
let selectedImage = null;


/* ELEMENTS */

const galleryBox = document.getElementById("galleryBox");
const searchInput = document.getElementById("searchInput");

const imageModal = document.getElementById("imageModal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalCaption = document.getElementById("modalCaption");
const likeCount = document.getElementById("likeCount");

const loginModal = document.getElementById("loginModal");


/* LOAD IMAGES */

async function loadImages(){

  galleryBox.innerHTML = "<p>Loading...</p>";

  try{

    const q = query(
      collection(db,"images"),
      orderBy("createdAt","desc")
    );

    const snap = await getDocs(q);

    images = snap.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    renderImages();

  }catch(error){

    console.error(error);

    galleryBox.innerHTML =
      "<p>Images load नहीं हो पाईं।</p>";

  }
}


/* RENDER */

function renderImages(){

  const text =
    searchInput.value.toLowerCase().trim();

  const filtered = images.filter(x => {

    return (
      (x.title || "").toLowerCase().includes(text) ||
      (x.caption || "").toLowerCase().includes(text) ||
      (x.prompt || "").toLowerCase().includes(text)
    );

  });

  galleryBox.innerHTML = "";

  if(filtered.length === 0){

    galleryBox.innerHTML =
      "<p style='color:#777;'>कोई image नहीं मिली।</p>";

    return;
  }


  filtered.forEach(x => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <img
        src="${x.url}"
        alt="${x.title || "AI Image"}"
        class="gallery-image"
      >

      <div class="card-content">

        <h3>
          ${x.title || "Untitled"}
        </h3>

        <p>
          ${x.caption || ""}
        </p>

        <div class="card-actions">

          <button class="small-btn view-btn">
            View
          </button>

          <button class="small-btn like-card">
            ❤️ ${x.likes || 0}
          </button>

        </div>

      </div>
    `;


    /* IMAGE CLICK */

    card.querySelector(".gallery-image")
      .onclick = () => openImage(x);


    /* VIEW CLICK */

    card.querySelector(".view-btn")
      .onclick = () => openImage(x);


    /* LIKE */

    card.querySelector(".like-card")
      .onclick = async () => {

        try{

          await updateDoc(
            doc(db,"images",x.id),
            {
              likes:increment(1)
            }
          );

          x.likes = (x.likes || 0) + 1;

          renderImages();

        }catch(error){

          alert("Like नहीं हो पाया।");

        }

      };


    galleryBox.appendChild(card);

  });

}


/* OPEN IMAGE */

function openImage(x){

  selectedImage = x;

  modalImage.src = x.url;

  modalTitle.textContent =
    x.title || "Untitled";

  modalCaption.textContent =
    x.caption || "";

  likeCount.textContent =
    x.likes || 0;


  /* ADMIN DELETE */

  document.getElementById("modalDelete").style.display =
    isAdmin ? "inline-block" : "none";


  imageModal.classList.add("show");

  document.body.style.overflow = "hidden";
}


/* IMPORTANT CLOSE FUNCTION */

function closeImage(){

  imageModal.classList.remove("show");

  modalImage.src = "";

  selectedImage = null;

  document.body.style.overflow = "";

}


/* X BUTTON */

document.getElementById("closeImage")
  .addEventListener("click", closeImage);


/* BACKGROUND CLICK */

imageModal.addEventListener("click", function(e){

  if(e.target === imageModal){

    closeImage();

  }

});


/* ESC KEY */

document.addEventListener("keydown", function(e){

  if(e.key === "Escape"){

    if(imageModal.classList.contains("show")){

      closeImage();

    }

    if(loginModal.classList.contains("show")){

      closeLogin();

    }

  }

});


/* SEARCH */

searchInput.addEventListener(
  "input",
  renderImages
);


/* COPY PROMPT */

document.getElementById("copyPrompt")
  .onclick = async () => {

    if(!selectedImage) return;

    try{

      await navigator.clipboard.writeText(
        selectedImage.prompt || ""
      );

      alert("Prompt copy हो गया ✅");

    }catch{

      alert("Prompt copy नहीं हो पाया।");

    }

  };


/* LIKE MODAL */

document.getElementById("likeBtn")
  .onclick = async () => {

    if(!selectedImage) return;

    try{

      await updateDoc(
        doc(db,"images",selectedImage.id),
        {
          likes:increment(1)
        }
      );

      selectedImage.likes =
        (selectedImage.likes || 0) + 1;

      likeCount.textContent =
        selectedImage.likes;

    }catch{

      alert("Like नहीं हो पाया।");

    }

  };


/* DOWNLOAD */

document.getElementById("downloadBtn")
  .onclick = () => {

    if(!selectedImage) return;

    const a = document.createElement("a");

    a.href = selectedImage.url;

    a.target = "_blank";

    a.download =
      (selectedImage.title || "broken-ai") + ".jpg";

    document.body.appendChild(a);

    a.click();

    a.remove();

  };


/* DELETE */

document.getElementById("modalDelete")
  .onclick = async () => {

    if(!isAdmin || !selectedImage) return;

    const ok = confirm(
      "क्या यह image delete करनी है?"
    );

    if(!ok) return;

    try{

      await deleteDoc(
        doc(db,"images",selectedImage.id)
      );

      closeImage();

      await loadImages();

      alert("Image delete हो गई ✅");

    }catch(error){

      console.error(error);

      alert(
        "Delete failed: " + error.message
      );

    }

  };


/* LOGIN OPEN */

document.getElementById("adminBtn")
  .onclick = () => {

    if(isAdmin){

      signOut(auth);

      return;

    }

    loginModal.classList.add("show");

    document.body.style.overflow = "hidden";

  };


/* LOGIN CLOSE */

function closeLogin(){

  loginModal.classList.remove("show");

  document.body.style.overflow = "";

}

document.getElementById("closeLogin")
  .onclick = closeLogin;


/* LOGIN */

document.getElementById("loginSubmit")
  .onclick = async () => {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if(email !== ADMIN_EMAIL){

      alert("यह Admin Email नहीं है।");

      return;

    }


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      closeLogin();

      alert("Admin Login सफल ✅");

    }catch(error){

      alert(
        "Login failed: " + error.message
      );

    }

  };


/* AUTH STATE */

onAuthStateChanged(auth, user => {

  isAdmin =
    !!user &&
    user.email === ADMIN_EMAIL;


  document.getElementById("uploadNav")
    .style.display =
      isAdmin ? "inline-block" : "none";


  document.getElementById("heroUpload")
    .style.display =
      isAdmin ? "inline-block" : "none";


  document.getElementById("upload")
    .style.display =
      isAdmin ? "block" : "none";


  document.getElementById("adminBtn")
    .textContent =
      isAdmin ? "Logout" : "Admin Login";


  if(imageModal.classList.contains("show")){

    document.getElementById("modalDelete")
      .style.display =
        isAdmin ? "inline-block" : "none";

  }

});


/* HERO UPLOAD */

document.getElementById("heroUpload")
  .onclick = () => {

    document.getElementById("upload")
      .scrollIntoView({
        behavior:"smooth"
      });

  };


/* UPLOAD */

document.getElementById("uploadBtn")
  .onclick = async () => {

    if(!isAdmin){

      alert("पहले Admin Login करें।");

      return;

    }


    const file =
      document.getElementById("imageFile").files[0];

    const title =
      document.getElementById("imageTitle").value.trim();

    const caption =
      document.getElementById("imageCaption").value.trim();

    const prompt =
      document.getElementById("imagePrompt").value.trim();


    if(!file){

      alert("पहले image चुनें।");

      return;

    }


    const uploadBtn =
      document.getElementById("uploadBtn");

    uploadBtn.disabled = true;

    uploadBtn.textContent =
      "Uploading...";


    try{

      /* CLOUDINARY */

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      const response =
        await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if(!data.secure_url){

        throw new Error(
          "Cloudinary upload failed"
        );

      }


      /* FIRESTORE */

      await addDoc(
        collection(db,"images"),
        {
          url:data.secure_url,
          title:title || "Untitled",
          caption:caption,
          prompt:prompt,
          likes:0,
          createdAt:serverTimestamp()
        }
      );


      document.getElementById("imageFile").value = "";

      document.getElementById("imageTitle").value = "";

      document.getElementById("imageCaption").value = "";

      document.getElementById("imagePrompt").value = "";


      alert("Image upload हो गई ✅");

      await loadImages();


    }catch(error){

      console.error(error);

      alert(
        "Upload failed: " + error.message
      );

    }


    uploadBtn.disabled = false;

    uploadBtn.textContent =
      "Upload Image";

  };


/* START */

loadImages();

</script>

</body>
</html>
